<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact Form</title>
</head>

<body>

    <div>
        <form action="">

            <h1>Contact Form</h1>

            <div>
                <label>Name :</label>
                <input type="text" name="firstname" placeholder="Enter You Name" required/>
            </div><br>

            <div>
                <label>Last Name :</label>
                <input  type="text" name="last_name" value="WsCube tech" readonly/>
            </div><br>

            <div>
                <label>Email :</label>

                <input type="email" name="useremail" placeholder="abc@gmail.com" required/>
            </div><br>


            <div>
                <label>Phone Number :</label>
                <input type="tel" name="phone_number" maxlength="10" placeholder="+91 8529322571" required/>
            </div><br>

            <div>
                <label>Gender :</label>

                <input type="radio" name="gender" value="male"/> Male
                <input type="radio"/ name="gender" value="female"> Female
                <input type="radio"/ name="gender" value="other"> Other
            </div><br>

            <div>
                <label>Hobbies :</label>

                <input type="checkbox" name="hobbies" value="reading"/> Reading
                <input type="checkbox" name="hobbies" value="codeing"/> Codeing 
                <input type="checkbox" name="hobbies" value="singing"/> Singing
                <input type="checkbox" name="hobbies" value="playing"/> playing
            </div><br>

            <div>
                <label>File Upload :</label>
                <input type="file" name="image"/>

                <label>DOB :</label>
                <input type="datetime-local" name="dob">

            </div><br>


            <div>

                <label>City :</label>

                <select name="city">
                    <option>--Select--</option>
                    <option value="jaipur">Jaipur</option>
                    <option value="jodhpur">Jodhpur</option>
                    <option value="pali">Pali</option>
                </select>

            </div><br>

            <div>
                <label>Message :</label>

                <textarea placeholder="message" name="message"></textarea>
            </div><br>


            <button type="submit">Save</button>
        </form>
    </div>

</body>

</html>
